<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
<meta name="theme-color" content="#f3efe6" id="theme-color">
<script>
(function () {
  var root = document.documentElement;
  root.className = 'js';
  var theme = 'light', lang = 'zh';
  try {
    if (localStorage.getItem('theme') === 'dark') theme = 'dark';
    if (localStorage.getItem('home_lang') === 'en') lang = 'en';
  } catch (_) {}
  root.dataset.theme = theme;
  root.dataset.lang = lang;
  root.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelector('#theme-color').content = theme === 'dark' ? '#101b2c' : '#f3efe6';
})();
</script>
<link rel="stylesheet" href="{{ '/assets/fonts/garden/fonts.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
