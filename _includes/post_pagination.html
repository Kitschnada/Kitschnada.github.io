{% if page.previous or page.next %}
<nav class="post-pagination" aria-label="Article navigation">
  <div>{% if page.previous %}<span class="eyebrow">{% include garden-text.html zh="上一篇" en="Previous" %}</span><a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% endif %}</div>
  <div>{% if page.next %}<span class="eyebrow">{% include garden-text.html zh="下一篇" en="Next" %}</span><a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}</div>
</nav>
{% endif %}
