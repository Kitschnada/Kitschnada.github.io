<button class="ring-toggle js-only" type="button" data-ring-toggle aria-expanded="false" aria-controls="garden-nav" aria-label="展开导航 / Open navigation" title="展开导航 / Open navigation" data-label-zh="展开导航" data-label-en="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M7 12h10"/></svg><span>{% include garden-text.html zh="导航" en="Navigate" %}</span></button>
<nav id="garden-nav" class="ring-nav" aria-label="主导航">
  {% for link in site.data.navigation.main %}
  <a class="ring-part" data-part="{{ forloop.index0 }}" href="{{ link.url | relative_url }}" aria-label="{{ link.title }} / {{ link.title_en }}" title="{{ link.title }} / {{ link.title_en }}" data-label-zh="{{ link.title }}" data-label-en="{{ link.title_en }}"{% if page.homepage and link.url == '/home/' %} aria-current="page"{% endif %}>
    <svg class="ring-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% case link.url %}{% when '/home/' %}<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>{% when '/blogs/' %}<rect x="4" y="3" width="13" height="17" rx="2"/><path d="M8 7h5M8 11h5M8 15h3M17 7h3v13a2 2 0 0 1-2 2"/>{% when '/portfolio/' %}<path d="m12 2 9 5-9 5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/>{% when '/cv/' %}<path d="M5 3h10l4 4v14H5zM14 3v5h5M9 12h6M9 16h6"/>{% else %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>{% endcase %}</svg>
    <span class="ring-label">{% include garden-text.html zh=link.title en=link.title_en %}</span>
  </a>
  {% endfor %}
</nav>
