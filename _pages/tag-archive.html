{% assign tags = site.tags | sort %}
{% for tag in tags %}
<section aria-labelledby="{{ tag[0] | slugify }}"><h2 id="{{ tag[0] | slugify }}">{{ tag[0] }}</h2>
{% for entry in tag[1] %}{% include garden-entry.html entry=entry %}{% endfor %}</section>
{% else %}{% include garden-empty.html %}{% endfor %}
